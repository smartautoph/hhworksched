<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HH Work Schedule</title>
<style>
:root{--navy:#071a3a;--navy2:#0b2855;--glass:rgba(255,255,255,.10);--glass2:rgba(255,255,255,.15);--line:rgba(255,255,255,.14);--text:#f7faff;--muted:#b8c5d9;--blue:#5aa7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#123b75 0,transparent 34%),radial-gradient(circle at 90% 85%,#0b4c78 0,transparent 30%),linear-gradient(145deg,var(--navy),#020b1d);font-family:Inter,system-ui,sans-serif;color:var(--text)}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.04),transparent 35%,rgba(255,255,255,.025));pointer-events:none}
.wrap{max-width:1180px;margin:auto;padding:34px 20px 60px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.brand{font-size:12px;font-weight:900;letter-spacing:.16em;color:#8dc5ff}.title{margin:5px 0 6px;font-size:clamp(30px,5vw,48px);letter-spacing:-.04em}.sub{margin:0;color:var(--muted)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.06));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px}
.search{display:flex;gap:10px;padding:12px;margin-bottom:18px}.search input{flex:1;background:rgba(0,0,0,.18);color:white;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;outline:none}.search input::placeholder{color:#9eacc2}.search input:focus{border-color:#65b0ff}.btn{border:0;border-radius:14px;padding:13px 19px;font-weight:800;cursor:pointer}.primary{background:#2d8cff;color:white;box-shadow:0 8px 22px rgba(45,140,255,.28)}
.daybar{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;margin-bottom:18px}.day{font-size:24px;font-weight:850}.shift{color:var(--muted);font-size:13px;margin-top:4px}.count{font-size:14px;color:#d7e6ff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}
.table{overflow:hidden}.thead,.row{display:grid;grid-template-columns:80px 1.8fr 1fr 1.2fr 120px;gap:14px;align-items:center;padding:14px 18px}.thead{color:#9fb2cd;font-size:11px;text-transform:uppercase;letter-spacing:.08em;background:rgba(0,0,0,.15)}.row{border-top:1px solid rgba(255,255,255,.08)}.row:hover{background:rgba(255,255,255,.045)}.id{font-weight:800;color:#b9d8ff}.name{font-weight:750}.muted{color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:850;width:max-content}.wfh{background:rgba(65,160,255,.18);color:#9ed1ff;border:1px solid rgba(90,167,255,.25)}.onsite{background:rgba(52,211,153,.15);color:#8af0c8;border:1px solid rgba(52,211,153,.22)}.off{background:rgba(148,163,184,.14);color:#cbd5e1;border:1px solid rgba(148,163,184,.2)}
.error{display:none;padding:13px 15px;border-radius:14px;margin-bottom:16px;background:rgba(239,68,68,.14);border:1px solid rgba(248,113,113,.25);color:#fecaca}.loading,.empty{text-align:center;color:var(--muted);padding:38px}.hidden{display:none}
@media(max-width:760px){.top{align-items:start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.thead{display:none}.row{grid-template-columns:1fr 1fr;gap:8px}.row>div:nth-child(2){grid-column:1/-1}.row>div:nth-child(4){text-align:right}.search{flex-direction:column}.primary{width:100%}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="brand">HH WORK SCHEDULE</div><h1 class="title">Team Schedule</h1><p class="sub">Today's complete roster · Philippine Time</p></div></div>
<div class="search glass"><input id="agentId" placeholder="Search your Agent ID or name"><button class="btn primary" onclick="searchAgent()">Search My Schedule</button></div>
<div id="error" class="error"></div><div id="app"><div class="loading glass">Loading today's team schedule…</div></div>
</div>
<script src="config.js"></script><script>
let dailyData=null;
function requestDaily(){hide();document.getElementById('app').innerHTML='<div class="loading glass">Loading today’s team schedule…</div>';jsonp('',d=>{if(!d.ok){err(d.error||'Unable to load today’s schedule.');return}dailyData=d;renderDaily(d)})}
function jsonp(query,done){const cb='cb_'+Date.now();let finished=false;const timer=setTimeout(()=>{if(!finished){finished=true;delete window[cb];err('The schedule service did not respond. Please try again.')}},15000);window[cb]=d=>{if(finished)return;finished=true;clearTimeout(timer);delete window[cb];done(d)};const s=document.createElement('script');s.src=APP_CONFIG.API_URL+(query?'?'+query+'&':'?')+'callback='+encodeURIComponent(cb)+'&_='+Date.now();s.onerror=()=>{if(finished)return;finished=true;clearTimeout(timer);delete window[cb];err('Unable to connect to the schedule service.')};document.body.appendChild(s)}
function renderDaily(d){const a=d.agents||[];const w=a.filter(x=>x.workSetup==='WFH').length,o=a.filter(x=>x.workSetup==='ONSITE').length,f=a.filter(x=>x.workSetup==='OFF').length;let h='<div class="daybar glass"><div><div class="day">'+esc(d.day+', '+d.dateLabel)+'</div><div class="shift">'+esc(d.shift.start)+' – '+esc(d.shift.end)+' PHT</div></div><div class="count">'+a.length+' agents</div></div><div class="stats"><div class="stat glass"><strong>'+w+'</strong><span>WFH</span></div><div class="stat glass"><strong>'+o+'</strong><span>ONSITE</span></div><div class="stat glass"><strong>'+f+'</strong><span>OFF / REST</span></div></div>';h+='<div class="table glass"><div class="thead"><div>Agent ID</div><div>Agent</div><div>Setup</div><div>Shift</div><div>Status</div></div>';if(!a.length)h+='<div class="empty">No schedule entries were found for today.</div>';a.forEach(x=>{const c=x.workSetup==='WFH'?'wfh':x.workSetup==='ONSITE'?'onsite':'off';h+='<div class="row"><div class="id">'+esc(x.agentId)+'</div><div class="name">'+esc(x.agentName)+'</div><div><span class="badge '+c+'">'+icon(x.workSetup)+' '+esc(x.workSetup)+'</span></div><div class="muted">'+esc(x.shiftStart)+' – '+esc(x.shiftEnd)+'</div><div class="muted">'+esc(desc(x.workSetup))+'</div></div>'});h+='</div>';document.getElementById('app').innerHTML=h}
function searchAgent(){const q=document.getElementById('agentId').value.trim().toLowerCase();if(!q){renderDaily(dailyData||{agents:[],day:'Today',dateLabel:'',shift:{start:'10:00 PM',end:'7:00 AM'}});return}if(!dailyData)return;const matches=(dailyData.agents||[]).filter(x=>x.agentId.toLowerCase().includes(q)||x.agentName.toLowerCase().includes(q));if(!matches.length){err('No matching agent found for “'+q+'”.');return}let h='<div class="daybar glass"><div><div class="day">My Schedule</div><div class="shift">'+esc(dailyData.day+', '+dailyData.dateLabel)+' · '+esc(dailyData.shift.start)+' – '+esc(dailyData.shift.end)+' PHT</div></div><button class="btn" style="background:rgba(255,255,255,.1);color:white" onclick="renderDaily(dailyData)">Show All</button></div><div class="table glass"><div class="thead"><div>Agent ID</div><div>Agent</div><div>Setup</div><div>Shift</div><div>Status</div></div>';matches.forEach(x=>{const c=x.workSetup==='WFH'?'wfh':x.workSetup==='ONSITE'?'onsite':'off';h+='<div class="row"><div class="id">'+esc(x.agentId)+'</div><div class="name">'+esc(x.agentName)+'</div><div><span class="badge '+c+'">'+icon(x.workSetup)+' '+esc(x.workSetup)+'</span></div><div class="muted">'+esc(x.shiftStart)+' – '+esc(x.shiftEnd)+'</div><div class="muted">'+esc(desc(x.workSetup))+'</div></div>'});h+='</div>';hide();document.getElementById('app').innerHTML=h}
function icon(x){return x==='WFH'?'🏠':x==='ONSITE'?'🏢':'—'}function desc(x){return x==='WFH'?'Work from Home':x==='ONSITE'?'Onsite':'Off / Rest Day'}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function err(x){document.getElementById('error').textContent=x;document.getElementById('error').style.display='block';document.getElementById('app').innerHTML=''}function hide(){document.getElementById('error').style.display='none'}
document.getElementById('agentId').addEventListener('keydown',e=>{if(e.key==='Enter')searchAgent()});requestDaily();
</script></body></html>
